<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Garante que o navegador sempre revalide esta página com o servidor em vez de
         usar uma cópia antiga guardada localmente no aparelho (ver scripts/atualizar-versao.js
         para o versionamento dos arquivos css/js abaixo). -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Bilhete da sorte</title>

    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="secret.css?v=20260906231640">

    <style>
        /* Estilo exclusivo desta página */
        .bilhete-tira {
            margin-top: 26px;
            background: #fffdf8;
            border: 1px solid rgba(183, 110, 121, 0.3);
            border-radius: 6px;
            padding: 22px 18px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-size: 1.15rem;
            color: var(--segredo-rose-escuro);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            position: relative;
        }
        .bilhete-tira::before,
        .bilhete-tira::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 10px;
            background: repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(183, 110, 121, 0.15) 3px, rgba(183, 110, 121, 0.15) 6px);
        }
        .bilhete-tira::before { left: 0; border-radius: 6px 0 0 6px; }
        .bilhete-tira::after { right: 0; border-radius: 0 6px 6px 0; }
        .bilhete-tira.vazio { color: rgba(51, 51, 51, 0.4); font-style: normal; font-family: inherit; font-size: 0.95rem; }
        .bilhete-tira.puxando { animation: bilhetePuxar 0.5s ease both; }
        @keyframes bilhetePuxar {
            from { opacity: 0; transform: translateY(-14px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="segredo-pagina">
    <div class="segredo-cartao">
        <p class="segredo-eyebrow">Puxe o seu</p>
        <h1 class="segredo-titulo">Bilhete da sorte</h1>
        <p class="segredo-texto" style="text-align:center;">Um bilhetinho apaixonado, sorteado na hora, toda vez que você puxar.</p>

        <!--
            COMO EDITAR OU ADICIONAR BILHETES NO FUTURO:
            Mexa só no array BILHETES_DA_SORTE aqui embaixo. Pode adicionar
            ou remover quantos itens quiser, o sorteio se ajusta sozinho.
        -->
        <div class="bilhete-tira vazio" id="bilheteTexto">Toque no botão pra puxar seu primeiro bilhete.</div>

        <button id="btnPuxarBilhete" class="segredo-btn">Puxar um bilhete</button>

        <a href="../index.html" class="segredo-voltar">← voltar</a>
    </div>

    <script>
const BILHETES_DA_SORTE = [
    'Hoje é um bom dia pra lembrar que você é o motivo que eu mais gosto de comemorar.',
    'Uma coisa boa está a caminho: sou eu, gostando de você um pouco mais do que ontem.',
    'O Chaves continua amando sanduíche de presunto, e eu continuo amando você do mesmo jeito de sempre.',
    'Sorte de hoje: alguém está pensando em te levar pro Grill esse fim de semana.',
    'Previsão: muitos anos de risada boba de carro pela frente, com direito a estrada de terra de vez em quando.',
    'Aviso importante: você é bem mais especial do que imagina, e eu reparo nisso todo dia.',
    'Sorte de hoje: um abraço apertado está reservado pra você, é só pedir.',
    'Previsão: as próximas viagens vão valer muito a pena, principalmente por causa da companhia.',

    'Sorte grande: você encontrou alguém que ainda sorri lembrando da primeira vez que viu você na faculdade.',
    'Previsão do dia: alguém vai olhar para você e pensar de novo: "como eu tive sorte".',
    'Aviso do universo: continue sendo essa pessoa que ama tanto os animais, porque essa é uma das coisas mais bonitas em você.',
    'Sorte liberada: um girassol imaginário foi plantado só para lembrar que você ilumina meus dias.',
    'Hoje a previsão é de sorriso fácil, provavelmente causado por alguma coisa boba que a gente vai rir junto.',
    'Bilhete premiado: você é a minha pessoa favorita para dividir qualquer lugar, até os mais simples.',
    'Sorte do dia: uma lembrança antiga nossa vai aparecer na sua cabeça e provavelmente arrancar um sorriso.',
    'Previsão: ainda teremos muitas histórias que começam com "lembra daquele dia?".',
    'Aviso importante: seu sorriso continua sendo uma das minhas coisas favoritas nesse mundo.',
    'Sorte encontrada: alguém ainda lembra daquele beijo no Colina como se fosse ontem.',
    'Previsão: teremos muitos filmes, séries e comentários durante cenas importantes pela frente.',
    'Bilhete secreto: aquela menina do cabelo loiro da faculdade mudou completamente a história de alguém.',

    'Sorte do dia: uma viagem para a praia ainda está nos planos, com direito a pé na areia.',
    'Previsão: muitos passeios sem destino, música alta e conversas que fazem a viagem valer mais que o destino.',
    'Aviso: cuidado, você pode receber um beijo inesperado a qualquer momento.',
    'Sorte liberada: você tem alguém que ama até o seu jeito mais distraído.',
    'Previsão: Kovu ainda vai participar de muitas aventuras nossas.',
    'Bilhete premiado: seu coração enorme continua sendo uma das coisas que mais admiro em você.',
    'Sorte de hoje: você vai lembrar que não precisa carregar tudo sozinha.',
    'Previsão: dias ruins passam, mas o carinho que existe entre nós fica.',
    'Aviso importante: você é mais forte do que imagina.',
    'Sorte encontrada: alguém está torcendo por você todos os dias.',

    'Previsão do futuro: muitos cafés, lanches, passeios no shopping e momentos simples que viram especiais.',
    'Bilhete do destino: algumas histórias começam com uma carona e terminam virando tudo que a gente sempre quis.',
    'Sorte do dia: escolher você continua sendo uma das melhores decisões que eu já tomei.',
    'Aviso: ainda temos muitos lugares para conhecer e muitas fotos para guardar.',
    'Previsão: muitas risadas de coisas que só nós dois vamos entender.',
    'Sorte grande: você é meu lugar favorito quando o mundo fica complicado.',
    'Bilhete especial: nunca esqueça o quanto você é amada.',
    'Previsão: teremos muitos "só mais cinco minutos" antes de levantar da cama.',
    'Sorte liberada: um abraço meu está sempre disponível para dias difíceis.',
    'Aviso importante: você não precisa ser perfeita para ser incrível.',

    'Bilhete secreto: eu ainda acho engraçado lembrar que você demorou quase uma eternidade para ficar pronta no nosso primeiro encontro.',
    'Sorte do dia: aquela vontade de construir uma história bonita continua aqui.',
    'Previsão: teremos muitos momentos simples que no futuro serão nossas melhores lembranças.',
    'Bilhete premiado: o melhor capítulo da nossa história ainda está sendo escrito.',
    'Sorte encontrada: entre milhões de pessoas, eu encontrei você.',
    'Aviso importante: continue sendo essa pessoa autêntica que eu conheci.',
    'Previsão: muitos "eu te amo" ainda vão aparecer pelo caminho.',
    'Sorte de hoje: alguém está feliz só por poder chamar você de amor.',
    'Bilhete final: se algum dia duvidar do quanto é especial, lembra que eu escrevi tudo isso porque você merece saber.',
];

        let ultimoIndiceBilhete = -1;

        function puxarBilhete() {
            let indice = Math.floor(Math.random() * BILHETES_DA_SORTE.length);
            if (BILHETES_DA_SORTE.length > 1) {
                while (indice === ultimoIndiceBilhete) {
                    indice = Math.floor(Math.random() * BILHETES_DA_SORTE.length);
                }
            }
            ultimoIndiceBilhete = indice;

            const tiraEl = document.getElementById('bilheteTexto');
            tiraEl.classList.remove('puxando', 'vazio');
            void tiraEl.offsetWidth;
            tiraEl.textContent = BILHETES_DA_SORTE[indice];
            tiraEl.classList.add('puxando');
        }

        document.getElementById('btnPuxarBilhete').addEventListener('click', puxarBilhete);
    </script>
</body>
</html>
