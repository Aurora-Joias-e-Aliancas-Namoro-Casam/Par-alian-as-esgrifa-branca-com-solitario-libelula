<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Garante que o navegador sempre revalide esta página com o servidor em vez de
         usar uma cópia antiga guardada localmente no aparelho (ver scripts/atualizar-versao.js
         para o versionamento dos arquivos css/js abaixo). -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Um vídeo pra você</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="secret.css?v=20260906231640">

    <style>
        /* Estilo exclusivo desta página */
        .video-secreto-wrap {
            position: relative;
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: #111;
        }
        .video-secreto-wrap video {
            width: 100%;
            display: block;
            border-radius: 14px;
        }
        .video-secreto-placeholder {
            padding: 50px 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
        }
        .video-secreto-placeholder i {
            font-size: 2rem;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body class="segredo-pagina">
    <div class="segredo-cartao">
        <p class="segredo-eyebrow">Um vídeo só pra você</p>
        <h1 class="segredo-titulo">Lembrar com quem escolheu passar a vida kkkk</h1>

        <!--
            ESTRUTURA PRONTA PRA TROCAR O VÍDEO NO FUTURO:
            Basta colocar o arquivo definitivo em /secret/assets/ com o
            nome "video-secreto.mp4" (ou .webm/.mov, o navegador escolhe o
            que suportar). Nenhuma linha de código precisa mudar, só o
            arquivo. Enquanto o arquivo não existir, aparece uma mensagem
            de aviso no lugar do player, sem quebrar a página.
        -->
        <div class="video-secreto-wrap">
            <video id="videoSecreto" controls playsinline>
                <source src="assets/video-secreto.mp4" type="video/mp4">
                <source src="assets/video-secreto.webm" type="video/webm">
                <source src="assets/video-secreto.mov" type="video/quicktime">
                Seu navegador não suporta a reprodução deste vídeo.
            </video>
            <div id="videoSecretoPlaceholder" class="video-secreto-placeholder" style="display:none;">
                <i aria-hidden="true">🎬</i>
                Vídeo ainda não adicionado.<br>
                Assim que o arquivo <code>video-secreto.mp4</code> (ou .webm/.mov) for colocado em <code>/secret/assets/</code>, ele aparece aqui automaticamente.
            </div>
        </div>

        <a href="../index.html" class="segredo-voltar">← voltar</a>
    </div>

    <script>
        // Se o arquivo de vídeo ainda não existir, troca o player pela
        // mensagem de aviso. Lógica isolada só desta página.
        (function () {
            const video = document.getElementById('videoSecreto');
            const placeholder = document.getElementById('videoSecretoPlaceholder');

            video.addEventListener('error', mostrarPlaceholder, true);

            // Se depois de um tempo curto nenhuma fonte carregou nada
            // (readyState continua 0), também mostra o aviso.
            setTimeout(function () {
                if (video.readyState === 0 && video.error) mostrarPlaceholder();
            }, 1500);

            function mostrarPlaceholder() {
                video.style.display = 'none';
                placeholder.style.display = 'block';
            }
        })();
    </script>
</body>
</html>
