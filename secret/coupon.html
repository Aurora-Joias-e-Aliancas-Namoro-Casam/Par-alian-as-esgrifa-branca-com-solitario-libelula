<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Garante que o navegador sempre revalide esta página com o servidor em vez de
         usar uma cópia antiga guardada localmente no aparelho (ver scripts/atualizar-versao.js
         para o versionamento dos arquivos css/js abaixo). -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Vale-presentes do amor</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="secret.css?v=20260906231640">

    <style>
        /* Estilo exclusivo desta página */
        .vale-carta {
            margin-top: 24px;
            border: 2px dashed var(--segredo-rose);
            border-radius: 14px;
            padding: 26px 20px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.2rem;
            color: var(--segredo-rose-escuro);
            background: rgba(183, 110, 121, 0.05);
        }
        .vale-carta.vazia { color: rgba(51, 51, 51, 0.4); font-family: inherit; font-size: 0.95rem; }
        .vale-carta.entrando { animation: valeEntrar 0.5s ease both; }
        @keyframes valeEntrar {
            from { opacity: 0; transform: scale(0.9) rotate(-2deg); }
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        .vale-contador {
            font-size: 0.75rem;
            color: rgba(51, 51, 51, 0.45);
            margin-top: 10px;
        }
    </style>
</head>
<body class="segredo-pagina">
    <div class="segredo-cartao">
        <p class="segredo-eyebrow">Um livrinho só nosso</p>
        <h1 class="segredo-titulo">Vale-presentes do amor</h1>
        <p class="segredo-texto" style="text-align:center;">Cada vez que você puxa, sai um vale-presente diferente pra usar comigo, sem data de validade.</p>

        <!--
            COMO EDITAR OU ADICIONAR VALES NO FUTURO:
            Mexa só no array VALES_PRESENTE aqui embaixo. Pode adicionar
            ou remover quantos itens quiser, o sorteio se ajusta sozinho.
        -->
        <div class="vale-carta vazia" id="valeCartaTexto">Toque no botão pra puxar seu primeiro vale.</div>
        <p class="vale-contador" id="valeContador"></p>

        <button id="btnPuxarVale" class="segredo-btn">Puxar um vale-presente</button>

        <a href="../index.html" class="segredo-voltar">← voltar</a>
    </div>

    <script>
const VALES_PRESENTE = [
    'Vale um hambúrguer do Grill, com picles, sem perguntar por quê.',
    'Vale uma batata do Alo Gordão só porque deu vontade.',
    'Vale uma ida ao shopping para passear sem pressa.',
    'Vale escolher qualquer sobremesa que você quiser.',
    'Vale um sorvete no dia que você escolher.',
    'Vale uma noite de cinema juntos, com direito a pipoca.',
    'Vale um lanche em algum lugar novo que a gente ainda não conhece.',
    'Vale uma saída surpresa, você só precisa estar pronta.',
    'Vale uma volta de carro sem destino, só ouvindo música.',
    'Vale escolher o restaurante do próximo encontro.',

    'Vale uma tarde inteira no shopping, entrando em todas as lojas que quiser.',
    'Vale uma compra de alguma coisinha que você goste.',
    'Vale um café ou lanche da tarde juntos.',
    'Vale uma visita em algum lugar que você sempre quis conhecer.',
    'Vale um passeio para ver bichinhos, porque eu sei que você ama.',
    'Vale uma ida na feira para comer alguma coisa gostosa.',
    'Vale uma noite de comida japonesa (ou do que você escolher).',
    'Vale um açaí em qualquer dia que bater vontade.',
    'Vale um McDonald’s sem precisar pensar nas calorias.',
    'Vale um dia de guloseimas: KitKat, Kinder, Ovomaltine e tudo que tiver direito.',

    'Vale uma tarde de jogos ou brincadeiras juntos.',
    'Vale escolher o próximo filme sem reclamação minha.',
    'Vale uma maratona de série até alguém dormir.',
    'Vale repetir nosso primeiro encontro do nosso jeito.',
    'Vale voltar em algum lugar especial da nossa história.',
    'Vale um passeio em Ribeirão só para aproveitar o dia.',
    'Vale uma viagem curta de um dia para algum lugar novo.',
    'Vale conhecer uma hamburgueria nova juntos.',
    'Vale um jantar escolhido por você.',
    'Vale um café da manhã fora de casa.',

    'Vale um dia sem você precisar escolher nada, eu resolvo tudo.',
    'Vale um dia de princesa, com direito a mimo e cuidado.',
    'Vale um presente surpresa escolhido por mim.',
    'Vale uma flor quando você menos esperar.',
    'Vale um girassol só porque lembrei de você.',
    'Vale uma foto nossa para guardar mais uma lembrança.',
    'Vale um passeio com o Kovu quando ele puder ir junto.',
    'Vale um dia de praia no futuro (esse aqui não tem data de validade).',
    'Vale uma viagem para criar uma memória nova.',
    'Vale um pôr do sol juntos em algum lugar bonito.',

    'Vale escolher a música da próxima viagem.',
    'Vale colocar Jorge & Mateus no volume máximo sem ninguém reclamar.',
    'Vale um dia inteiro fazendo suas vontades.',
    'Vale uma surpresa sem você perguntar antes o que é.',
    'Vale uma noite de conversa até perder a hora.',
    'Vale um abraço demorado quando precisar.',
    'Vale um beijo extra sempre que solicitar.',
    'Vale um pedido atendido sem precisar explicar muito.',
    'Vale um "sim" para aquele plano aleatório seu.',
    'Vale guardar esse vale e usar quando quiser.'
];

        let ultimoIndiceVale = -1;
        let vezesQuePuxou = 0;

        function puxarVale() {
            let indice = Math.floor(Math.random() * VALES_PRESENTE.length);
            // Evita repetir o mesmo vale duas vezes seguidas, se houver mais de um
            if (VALES_PRESENTE.length > 1) {
                while (indice === ultimoIndiceVale) {
                    indice = Math.floor(Math.random() * VALES_PRESENTE.length);
                }
            }
            ultimoIndiceVale = indice;
            vezesQuePuxou++;

            const cartaEl = document.getElementById('valeCartaTexto');
            cartaEl.classList.remove('entrando', 'vazia');
            void cartaEl.offsetWidth; // reinicia a animação mesmo puxando de novo
            cartaEl.textContent = VALES_PRESENTE[indice];
            cartaEl.classList.add('entrando');

            document.getElementById('valeContador').textContent =
                vezesQuePuxou === 1 ? 'primeiro vale puxado' : vezesQuePuxou + 'º vale puxado';
        }

        document.getElementById('btnPuxarVale').addEventListener('click', puxarVale);
    </script>
</body>
</html>
