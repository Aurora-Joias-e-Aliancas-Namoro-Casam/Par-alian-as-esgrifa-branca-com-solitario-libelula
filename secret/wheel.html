<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Garante que o navegador sempre revalide esta página com o servidor em vez de
         usar uma cópia antiga guardada localmente no aparelho (ver scripts/atualizar-versao.js
         para o versionamento dos arquivos css/js abaixo). -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Roleta de ideias de encontro</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="secret.css?v=20260906231640">

    <style>
        /* Estilo exclusivo desta página */
        .roleta-area {
            position: relative;
            width: min(260px, 100%);
            height: auto;
            aspect-ratio: 1;
            margin: 24px auto 10px;
        }
        .roleta-ponteiro {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid var(--segredo-rose-escuro);
            z-index: 2;
        }
        .roleta-roda {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
            border: 4px solid #fff;
            transition: transform 3.2s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .roleta-fatia-label {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 110px;
            font-size: 0.68rem;
            font-weight: 600;
            color: #fff;
            text-align: center;
            line-height: 1.15;
            transform-origin: left center;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        }
        .roleta-centro {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 26px;
            height: 26px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }
        .roleta-resultado {
            margin-top: 18px;
            min-height: 50px;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.25rem;
            color: var(--segredo-rose-escuro);
        }
    </style>
</head>
<body class="segredo-pagina">
    <div class="segredo-cartao">
        <p class="segredo-eyebrow">Bora decidir juntos</p>
        <h1 class="segredo-titulo">Roleta de ideias de encontro</h1>
        <p class="segredo-texto" style="text-align:center;">Sem paciência pra decidir o que fazer? Gira a roleta e deixa ela escolher por nós.</p>

        <div class="roleta-area">
            <div class="roleta-ponteiro" aria-hidden="true"></div>
            <div class="roleta-roda" id="roletaRoda">
                <div class="roleta-centro" aria-hidden="true"></div>
            </div>
        </div>

        <p class="roleta-resultado" id="roletaResultado"></p>

        <button id="btnGirarRoleta" class="segredo-btn">Girar</button>

        <a href="../index.html" class="segredo-voltar">← voltar</a>
    </div>

    <script>
        /*
            COMO EDITAR OU ADICIONAR IDEIAS NO FUTURO:
            Mexa só no array IDEIAS_DE_ENCONTRO aqui embaixo. A roleta é
            desenhada automaticamente de acordo com o número de itens, não
            precisa mexer em mais nada.
        */
        const IDEIAS_DE_ENCONTRO = [
    'Ir comer no Grill',
    'Assistir um filme em casa',
    'Sair pra uma volta de carro sem destino',
    'Visitar algum lugar novo perto de casa',
    'Fazer um piquenique',
    'Ver o pôr do sol em algum lugar bonito',
    'Cozinhar alguma coisa juntos',
    'Rever fotos antigas dos dois',

    'Ir ao shopping sem comprar nada, só passear juntos',
    'Escolher um restaurante que nunca fomos',
    'Conhecer uma hamburgueria nova',
    'Tomar sorvete e andar pela cidade',
    'Ir tomar um açaí juntos',
    'Fazer uma noite de jogos',
    'Jogar algum jogo de tabuleiro juntos',
    'Montar uma playlist nova para nossas viagens',

    'Fazer uma viagem de um dia para uma cidade próxima',
    'Pegar o carro e escolher o destino no caminho',
    'Conhecer uma praça bonita',
    'Visitar um parque diferente',
    'Voltar no Colina para lembrar do começo',
    'Recriar nosso primeiro encontro',
    'Ir em um lugar que lembre nossa história',
    'Fazer uma caça ao tesouro um para o outro',

    'Fazer um jantar especial em casa',
    'Preparar uma sobremesa juntos',
    'Fazer brigadeiro assistindo filme',
    'Comprar várias besteiras e fazer uma noite de guloseimas',
    'Fazer uma noite de pizza',
    'Comer lanche no carro igual antigamente',
    'Fazer um café da manhã diferente',
    'Tomar café juntos em algum lugar novo',

    'Ir ver animais em algum lugar',
    'Passear com o Kovu',
    'Conhecer uma fazenda ou lugar com animais',
    'Plantar alguma coisa juntos',
    'Comprar um girassol para casa',
    'Fazer uma foto bonita com flores',

    'Ir para um lugar com natureza',
    'Fazer uma trilha leve',
    'Sentar em algum lugar tranquilo e conversar',
    'Passar uma tarde sem mexer no celular',
    'Ver as estrelas juntos',
    'Ficar no carro conversando até perder a hora',

    'Fazer uma sessão de fotos dos dois',
    'Criar um álbum com nossas lembranças',
    'Imprimir fotos antigas e montar uma parede de memórias',
    'Escrever cartas para abrir no futuro',
    'Gravar uma mensagem para nós daqui alguns anos',

    'Escutar Jorge & Mateus juntos no carro',
    'Fazer uma viagem ouvindo nossas músicas favoritas',
    'Criar uma playlist só nossa',
    'Cantar músicas no carro sem vergonha nenhuma',
    'Ouvir "Um Dia Te Levo Comigo" e lembrar da nossa história',

    'Ir para a praia (planejamento obrigatório)',
    'Planejar uma viagem dos sonhos juntos',
    'Escolher um lugar que queremos conhecer',
    'Fazer uma lista de lugares para visitar',

    'Ter um dia onde um escolhe tudo e o outro só acompanha',
    'Fazer um encontro surpresa sem contar o destino',
    'Trocar pequenos presentes sem motivo',
    'Fazer um dia de preguiça juntos',
    'Dormir abraçados assistindo série',
    'Passar uma noite relembrando como tudo começou',

    'Ir comer alguma coisa depois da faculdade',
    'Fazer um passeio igual aos nossos primeiros dias',
    'Ir até algum lugar e conversar sobre o futuro',
    'Criar uma nova lembrança para contar daqui anos'
];

        const CORES_ROLETA = ['#B76E79', '#c98891', '#8f4d57', '#d9a3ab', '#a15d67', '#e3b9c0'];

        const roda = document.getElementById('roletaRoda');
        const anguloFatia = 360 / IDEIAS_DE_ENCONTRO.length;

        // Monta o gradiente cônico com as fatias
        let gradiente = 'conic-gradient(';
        IDEIAS_DE_ENCONTRO.forEach(function (_, i) {
            const cor = CORES_ROLETA[i % CORES_ROLETA.length];
            gradiente += cor + ' ' + (i * anguloFatia) + 'deg ' + ((i + 1) * anguloFatia) + 'deg' + (i < IDEIAS_DE_ENCONTRO.length - 1 ? ', ' : '');
        });
        gradiente += ')';
        roda.style.background = gradiente;

        /*
            CORREÇÃO (textos sobrepostos): com quase 70 ideias na lista, cada
            fatia da roleta ocupa só uns 5 graus — não existe fonte pequena o
            suficiente pra caber um texto inteiro nesse espaço sem esbarrar
            no texto da fatia vizinha, então as ideias apareciam todas
            amontoadas umas em cima das outras. Em vez de escrever cada ideia
            dentro da própria fatia (que nunca vai caber com esse tanto de
            itens), a roleta agora só mostra as cores; a ideia sorteada
            aparece por extenso, bem legível, no texto de resultado logo
            abaixo depois que ela para de girar.
        */

        let rotacaoAtual = 0;

        function girarRoleta() {
            const n = IDEIAS_DE_ENCONTRO.length;
            const indiceEscolhido = Math.floor(Math.random() * n);
            const centroFatia = indiceEscolhido * anguloFatia + anguloFatia / 2;
            const voltasExtras = 5 * 360;
            // A roleta gira no sentido horário; o ponteiro fica fixo no topo
            // (0deg), então precisamos parar com a fatia escolhida ali.
            const alvo = voltasExtras + (360 - centroFatia);

            rotacaoAtual += alvo;
            roda.style.transform = 'rotate(' + rotacaoAtual + 'deg)';

            document.getElementById('roletaResultado').textContent = '';
            document.getElementById('btnGirarRoleta').disabled = true;

            setTimeout(function () {
                document.getElementById('roletaResultado').textContent = IDEIAS_DE_ENCONTRO[indiceEscolhido];
                document.getElementById('btnGirarRoleta').disabled = false;
            }, 3300);
        }

        document.getElementById('btnGirarRoleta').addEventListener('click', girarRoleta);
    </script>
</body>
</html>
